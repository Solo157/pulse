# storage-service (Этап 2): читает metrics, пишет точки в ClickHouse пакетом (раздел 6.3).

spring:
  application:
    name: pulse-storage-service
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    url: ${SPRING_DATASOURCE_URL:jdbc:clickhouse://localhost:8123/pulse?connect_timeout=2000&socket_timeout=10000}
    username: ${SPRING_DATASOURCE_USERNAME:default}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: storage-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # Коммит делает контейнер после успешной вставки пачки (ack-mode=batch).
      enable-auto-commit: false
      # Пакетная запись в ClickHouse: 500 событий на poll (согласование п. 9).
      max-poll-records: 500
      properties:
        max.poll.interval.ms: 120000
        session.timeout.ms: 15000
    listener:
      type: batch
      ack-mode: batch
  jackson:
    # Читаем JSON событийMetricEvent; неизвестные поля допускаем — схема может расширяться.
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${STORAGE_SERVER_PORT:8081}
  shutdown: graceful

pulse:
  metrics-topic: ${KAFKA_METRICS_TOPIC:metrics}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${INSTANCE_ID:${HOSTNAME:${spring.application.name}}}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'} %5p [${INSTANCE_ID:${HOSTNAME:pulse-storage-service}}] [req=%X{requestId:- }] %logger{20} - %msg%n"
  level:
    com.pulse: INFO
