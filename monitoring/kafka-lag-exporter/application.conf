# Конфигурация kafka-lag-exporter (Lightbend 0.6.x): мониторинг consumer lag
# через Admin API Kafka — exporter НЕ вступает в потребительские группы.
# Whitelists ограничивают сбор группами конвейера и топиками стенда
# (кардинальность метрик = группы x топики x партиции).
kafka-lag-exporter {
  clusters = [
    {
      name = "pulse"
      bootstrap-brokers = "kafka1:9092,kafka2:9092"
      group-whitelist = ["^(storage-group|processing-metrics|notification-group|metric-group)$"]
      topic-whitelist = ["^(metrics|incidents)$"]
    }
  ]
  reporters.prometheus.port = 8000
  poll-interval = 15 seconds
}
