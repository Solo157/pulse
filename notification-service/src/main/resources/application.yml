# notification-service (Этап 4): уведомления об инцидентах (FR-5, раздел 6.5).

spring:
  application:
    name: pulse-notification-service
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulse?connectTimeout=2&socketTimeout=5}
    username: ${SPRING_DATASOURCE_USERNAME:pulse}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 120000
        session.timeout.ms: 15000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Читаем событие чужого сервиса: неизвестные поля допускаем.
      fail-on-unknown-properties: false

server:
  port: ${NOTIFICATION_SERVER_PORT:8083}
  shutdown: graceful

pulse:
  incidents-topic: ${KAFKA_INCIDENTS_TOPIC:incidents}
  # Демонстрационный канал доставки: HTTP-endpoint в этом же сервисе
  # (см. DemoNotificationReceiverController). Заменяется на реальный адрес при согласовании.
  delivery-url: ${PULSE_DELIVERY_URL:http://localhost:${NOTIFICATION_SERVER_PORT:8083}/internal/demo-receiver}
  delivery-timeout: ${PULSE_DELIVERY_TIMEOUT:3s}
  delivery-max-attempts: ${PULSE_DELIVERY_MAX_ATTEMPTS:3}
  delivery-retry-delay: ${PULSE_DELIVERY_RETRY_DELAY:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      instance: ${INSTANCE_ID:${HOSTNAME:${spring.application.name}}}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'} %5p [${INSTANCE_ID:${HOSTNAME:${spring.application.name}}}] [req=%X{requestId:- }] %logger{20} - %msg%n"
  level:
    com.pulse: INFO
