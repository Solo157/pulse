# =============================================================================
# Pulse — API Gateway (single nginx instance), §6.1
#
# Dynamic instance discovery for scaled metric-service replicas.
# `set $backend metric-service` + `resolver 127.0.0.11` (Docker DNS): every
# request re-resolves the service name, so newly added / removed Compose
# replicas are picked up without an nginx reload. Docker's DNS round-robins
# across the instances, giving request distribution across MetricService
# (least_conn is an OSS-nginx feature for multi-`server` upstreams and would
# require a reload on scale; documented as a DEMO limitation in result.md).
# =============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 3s;

    map $upstream_addr $upstream_instance { default $upstream_addr; }

    log_format pulse '$remote_addr - [$time_local] "$request" '
                     'status=$status req_time=$request_time upstream=$upstream_addr '
                     'upstream_status=$upstream_status req_id=$request_id';

    server {
        listen 80;

        location / {
            set $backend metric-service;
            proxy_pass http://$backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_read_timeout 60s;

            error_page 502 503 504 @gw_error;
        }

        location @gw_error {
            default_type application/json;
            return 503 '{"status":503,"title":"Service Unavailable","detail":"No healthy MetricService reachable via gateway"}';
        }
    }
}
