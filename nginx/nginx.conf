# =============================================================================
# Pulse — API Gateway: единственный вход для клиентов (§6.1), один экземпляр nginx.
#
# Как находятся реплики metric-service: внутри location адрес сервиса задан
# переменной ($backend) и на каждый запрос заново разрешается через DNS Docker
# (resolver 127.0.0.11, обновление раз в секунду). Поэтому заново поднятые и
# удалённые реплики (docker compose up -d --scale) попадают в балансировку сами,
# без перезагрузки nginx. Саму расстановку запросов между адресами делает DNS:
# он отдаёт все адреса по кругу. Режим least_conn (наименее занятый сервер)
# требует списка server'ов в upstream и перезагрузки при масштабировании —
# сознательное ограничение DEMO, описано в result.md.
# =============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 3s;

    log_format pulse '$remote_addr - [$time_local] "$request" '
                     'status=$status req_time=$request_time upstream=$upstream_addr '
                     'upstream_status=$upstream_status req_id=$request_id';

    server {
        listen 80;

        location / {
            set $backend metric-service;
            proxy_pass http://$backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_read_timeout 60s;

            error_page 502 503 504 @gw_error;
        }

        location @gw_error {
            default_type application/json;
            return 503 '{"status":503,"title":"Service Unavailable","detail":"No healthy MetricService reachable via gateway"}';
        }
    }
}
